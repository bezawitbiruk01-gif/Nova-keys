name: Android CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 platform and build tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Gradle local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > NovaKeys/local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x NovaKeys/gradlew

      - name: Build debug APK
        working-directory: NovaKeys
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BIRUK-MUSIC-KEYBOARD-debug-apk
          path: NovaKeys/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
